name: Refresh live rotation check

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for daily rotation
        if: github.event_name == 'schedule'
        run: sleep 30

      - name: Fetch live level index
        run: python3 .github/scripts/fetch_live.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "chore: refresh live rotation check"
          git push
